[pytest]
# Dedicated configuration for the HTTP integration suite
# (iteration 20 / Epic 20.4A). run_integration.sh passes it with `-c`, so this
# file — not the repository-root pytest.ini — decides rootdir and collection.
#
# Why a dedicated file: the root pytest.ini is Flask-era. Its `testpaths = tests`
# points at a directory that iteration 19 moved to
# docs/archive/legacy-flask-tests/, and its addopts require pytest-cov and
# pytest-timeout, which CI does not install. Relying on it meant that whenever
# pytest was handed no usable path it fell back to collecting the whole
# repository — including the archived Flask suite, whose imports are not
# installed — and the release gate died on a collection error instead of
# running the integration tests.
#
# `-p no:cacheprovider` keeps the run from writing .pytest_cache into the tree.
#
# Scope comes from the explicit path run_integration.sh passes
# (test_api_integration.py), not from this file: pytest resolves both `testpaths`
# and the default collection root against the *invocation directory*, so neither
# setting can keep a bare `pytest -c <this file>` scoped to this suite. What this
# file does guarantee is that the Flask-era repository-root pytest.ini is not
# loaded (no missing `tests/` testpaths, no addopts needing absent plugins).
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -p no:cacheprovider
