[pytest]
# 快速测试配置
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# 标记定义
markers =
    unit: marks tests as unit tests (fast)
    functional: marks tests as functional tests (slow)
    integration: marks tests as integration tests (slow)
    slow: marks tests as slow tests
    browser: marks tests that require a browser (slow)
    fast: marks tests as fast tests

# 性能优化选项
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    --maxfail=3
    --durations=10
    -q

# 并行测试配置
# 使用 -n auto 或 -n <number> 来启用
# 例如: pytest -n auto

# 过滤选项
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

# 最小化日志输出
log_cli = false
log_level = ERROR

# 缓存配置
cache_dir = .pytest_cache

# 禁用不必要的插件
addopts = -p no:warnings -p no:cacheprovider

# 测试发现配置
python_ignore = [
    "setup.py",
    "conftest.py.backup"
]

# 跳过集合
collect_ignore = [
    "setup.py",
    "scripts/",
    "docs/",
    "build/",
    "dist/"
] 