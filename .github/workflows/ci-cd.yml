name: WoniuNote CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, phase2-development ]
  pull_request:
    branches: [ main, master, develop, phase2-development ]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - unit
          - integration
          - security
          - performance
      environment:
        description: 'Target Environment'
        required: false
        default: 'testing'
        type: choice
        options:
          - testing
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POSTGRES_DB: woniunote_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

jobs:
  # 1. 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install flake8 black isort mypy bandit safety

    - name: Lint with flake8
      run: |
        flake8 woniunote --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 woniunote --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: black --check --diff woniunote tests

    - name: Import sort check
      run: isort --check-only --diff woniunote tests

    - name: Type check with mypy
      run: mypy woniunote --ignore-missing-imports

    - name: Security scan with bandit
      run: bandit -r woniunote -f json -o security-report.json

    - name: Safety check for vulnerabilities
      run: safety check

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.json

  # 2. 单元测试
  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Set up test database
      run: |
        python scripts/setup_test_database.py

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short \
          --cov=woniunote --cov-report=xml --cov-report=html --cov-report=term-missing \
          --cov-fail-under=80 \
          --junitxml=test-results-unit.xml

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: unit-test-results
        path: |
          test-results-unit.xml
          htmlcov/

  # 3. 集成测试
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Set up test database
      run: |
        python scripts/setup_test_database.py

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short \
          --cov=woniunote --cov-report=xml --cov-report=html --cov-report=term-missing \
          --cov-fail-under=90 \
          --junitxml=test-results-integration.xml

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: |
          test-results-integration.xml
          htmlcov/

  # 4. 安全测试
  security-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run security tests
      run: |
        pytest tests/security/ -v --tb=short \
          --junitxml=test-results-security.xml

    - name: Upload security test results
      uses: actions/upload-artifact@v3
      with:
        name: security-test-results
        path: test-results-security.xml

  # 5. 性能测试
  performance-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Set up test database
      run: |
        python scripts/setup_test_database.py

    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --tb=short \
          --junitxml=test-results-performance.xml \
          --durations=10

    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: test-results-performance.xml

  # 6. 端到端测试
  e2e-tests:
    runs-on: ubuntu-latest
    needs: performance-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Set up test database
      run: |
        python scripts/setup_test_database.py

    - name: Start application
      run: |
        python -m woniunote.app &
        sleep 10

    - name: Run E2E tests
      run: |
        pytest tests/e2e/ -v --tb=short \
          --junitxml=test-results-e2e.xml

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-results
        path: test-results-e2e.xml

  # 7. 测试报告生成
  test-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests, performance-tests, e2e-tests]
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download test artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts/

    - name: Generate comprehensive test report
      run: |
        python scripts/generate_test_report.py

    - name: Upload test report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: |
          test-report.html
          test-report.json
          coverage-report.html

    - name: Test Results Summary
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Count test results
        UNIT_PASSED=$(grep -c "testcase" test-artifacts/unit-test-results/test-results-unit.xml 2>/dev/null || echo "0")
        UNIT_FAILED=$(grep -c "failure\|error" test-artifacts/unit-test-results/test-results-unit.xml 2>/dev/null || echo "0")

        INTEGRATION_PASSED=$(grep -c "testcase" test-artifacts/integration-test-results/test-results-integration.xml 2>/dev/null || echo "0")
        INTEGRATION_FAILED=$(grep -c "failure\|error" test-artifacts/integration-test-results/test-results-integration.xml 2>/dev/null || echo "0")

        SECURITY_PASSED=$(grep -c "testcase" test-artifacts/security-test-results/test-results-security.xml 2>/dev/null || echo "0")
        SECURITY_FAILED=$(grep -c "failure\|error" test-artifacts/security-test-results/test-results-security.xml 2>/dev/null || echo "0")

        PERFORMANCE_PASSED=$(grep -c "testcase" test-artifacts/performance-test-results/test-results-performance.xml 2>/dev/null || echo "0")
        PERFORMANCE_FAILED=$(grep -c "failure\|error" test-artifacts/performance-test-results/test-results-performance.xml 2>/dev/null || echo "0")

        E2E_PASSED=$(grep -c "testcase" test-artifacts/e2e-test-results/test-results-e2e.xml 2>/dev/null || echo "0")
        E2E_FAILED=$(grep -c "failure\|error" test-artifacts/e2e-test-results/test-results-e2e.xml 2>/dev/null || echo "0")

        TOTAL_PASSED=$((UNIT_PASSED + INTEGRATION_PASSED + SECURITY_PASSED + PERFORMANCE_PASSED + E2E_PASSED))
        TOTAL_FAILED=$((UNIT_FAILED + INTEGRATION_FAILED + SECURITY_FAILED + PERFORMANCE_FAILED + E2E_FAILED))

        echo "| Test Type | Passed | Failed | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | $UNIT_PASSED | $UNIT_FAILED | $([ $UNIT_FAILED -eq 0 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration | $INTEGRATION_PASSED | $INTEGRATION_FAILED | $([ $INTEGRATION_FAILED -eq 0 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | $SECURITY_PASSED | $SECURITY_FAILED | $([ $SECURITY_FAILED -eq 0 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance | $PERFORMANCE_PASSED | $PERFORMANCE_FAILED | $([ $PERFORMANCE_FAILED -eq 0 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | $E2E_PASSED | $E2E_FAILED | $([ $E2E_FAILED -eq 0 ] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Total: $TOTAL_PASSED passed, $TOTAL_FAILED failed**" >> $GITHUB_STEP_SUMMARY

        # Overall status
        if [ $TOTAL_FAILED -eq 0 ]; then
          echo "🎉 All tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Some tests failed. Please review the test results." >> $GITHUB_STEP_SUMMARY
        fi

  # 8. 部署到测试环境
  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: test-report
    if: github.ref == 'refs/heads/develop' && needs.test-report.result == 'success'
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your deployment commands here
        echo "✅ Staging deployment completed"

  # 9. 部署到生产环境
  deploy-to-production:
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deploy-to-staging.result == 'success'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to production
      run: |
        echo "🎯 Deploying to production environment..."
        # Add your production deployment commands here
        echo "✅ Production deployment completed"

  # 10. 通知
  notification:
    runs-on: ubuntu-latest
    needs: [test-report, deploy-to-staging, deploy-to-production]
    if: always()
    steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "WoniuNote CI/CD Pipeline Completed",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 WoniuNote CI/CD Pipeline Results"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:* ${{ github.ref_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:* ${{ github.sha }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Triggered by:* ${{ github.actor }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:* ${{ job.status }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "📊 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View detailed results>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 11. 清理
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const oneDayAgo = new Date();
          oneDayAgo.setDate(oneDayAgo.getDate() - 1);

          for (const artifact of artifacts.data) {
            if (new Date(artifact.created_at) < oneDayAgo) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
          }
