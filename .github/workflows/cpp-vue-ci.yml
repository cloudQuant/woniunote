name: WoniuNote C++/Vue CI

# CI for the active dev_cpp stack: C++ Drogon backend + Vue 3 frontend.
# Legacy Flask workflows are manual no-op notices and do not run automatically.

on:
  push:
    branches: [ dev_cpp, master, main ]
  pull_request:
    branches: [ dev_cpp, master, main ]

env:
  # Pinned vcpkg tool checkout. Must match "builtin-baseline" in
  # backend_cpp/vcpkg.json; the cache key and the checkout step both use it so
  # builds are reproducible instead of "whatever vcpkg HEAD is today".
  VCPKG_BASELINE: e7b524242c8a5d718a7afa26794c3c19bb8b0c71
  # Node acceptance version (see frontend/package.json engines: >=20.19.0).
  NODE_VERSION: "22.13.0"

jobs:
  repo-hygiene:
    name: Repo hygiene (tracked secrets + generated artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release version consistency
        # Single source of truth: backend_cpp/CMakeLists.txt project VERSION.
        run: bash scripts/check_release_version.sh

      - name: Block tracked secrets and generated artifacts
        run: |
          set -euo pipefail
          tracked="$(
            {
              git ls-files '*.key' '*.pem' '*.crt' '*.csr'
              git ls-files backups
              git ls-files coverage.json coverage.xml
              git ls-files docs/archive/legacy-flask-tests/test_db
              git ls-files configs/mysql_test_config.yaml docs/archive/legacy-flask-tests/configs/user_password_config.yaml
            } | sort -u
          )"
          if [ -n "$tracked" ]; then
            echo "The following sensitive/generated files are tracked and must be removed:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          if git grep -n -I -E 'BEGIN ((RSA|EC|OPENSSH) )?PRIVATE KEY' -- . ':!frontend/package-lock.json'; then
            echo "Potential private key material found in tracked files." >&2
            exit 1
          fi
          # 已知泄露凭据的回归防线（迭代19：公开仓库凭据事件）。
          # [x] 写法避免模式在门禁文件自身中被自匹配。
          if git grep -n -I -iE 'woniunote_[p]assword|woniunote[1]23' -- . ':!frontend/package-lock.json'; then
            echo "Known leaked credential literals found in tracked files." >&2
            exit 1
          fi
          # 明文 SQL 口令（如 ALTER USER ... IDENTIFIED BY '...'）
          if git grep -n -I -E "IDENTIFIED (WITH [a-z_]+ )?BY '[^']{6,}'" -- '*.sql'; then
            echo "Plaintext credentials in tracked SQL files." >&2
            exit 1
          fi
          # 脚本中 DB_PASS 的字面量默认值（应改为必填环境变量）
          if git grep -n -I -E 'DB_PASS=(\$\{DB_PASS:-)?["'"'"'][A-Za-z0-9!@#$%^&*_-]{6,}["'"'"']' -- '*.sh'; then
            echo "Hardcoded DB_PASS default found in tracked scripts." >&2
            exit 1
          fi

  backend-cpp:
    name: Backend (C++ build + tests)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config \
            libssl-dev

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          # Key covers the pinned tool revision, the manifest, and the overlay
          # port (whose patch changes the drogon ABI hash).
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('backend_cpp/vcpkg.json', 'backend_cpp/vcpkg-configuration.json', 'backend_cpp/vcpkg-overlay-ports/**') }}

      - name: Checkout pinned vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          git -C "$HOME/vcpkg" fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C "$HOME/vcpkg" checkout --detach "$VCPKG_BASELINE"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "vcpkg at $(git -C "$HOME/vcpkg" rev-parse HEAD)"

      - name: Configure
        working-directory: backend_cpp
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        working-directory: backend_cpp
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        working-directory: backend_cpp/build
        # --no-tests=error: a build that silently drops the test suite must not
        # be reported as a pass.
        run: ctest --output-on-failure --no-tests=error

  backend-static-analysis:
    name: Backend (cppcheck static analysis)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Static analysis as a real gate. The baseline is clean (iteration 13),
      # so any newly-introduced warning/perf/portability issue fails the build.
      # The script is shared with local runs so CI cannot drift from what a
      # developer runs; it also supplies the WONIUNOTE_VERSION define that CMake
      # injects (without it every use is an `unknownMacro` finding).
      - name: Run cppcheck (blocking)
        run: bash backend_cpp/scripts/run_cppcheck.sh

  frontend-vue:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node version
        working-directory: frontend
        run: npm run check:node

      - name: Install dependencies (lockfile-exact)
        working-directory: frontend
        # npm ci only: a lockfile/manifest mismatch must fail the job instead of
        # being papered over by a fresh resolve (iteration 20 / Epic 20.3A).
        run: npm ci

      - name: Audit production dependencies (blocking)
        working-directory: frontend
        # Supply-chain gate: fail on high/critical advisories in *runtime*
        # dependencies. Iteration 14 tightens this to moderate now that the
        # PostCSS baseline is fixed in package-lock.
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org

      - name: Audit all dependencies (advisory only)
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Lint
        working-directory: frontend
        # Iteration 14 drives the warning baseline to zero.
        run: npm run lint:ci

      - name: Check for silent catch blocks (blocking)
        working-directory: frontend
        # Epic 18.1: every catch block must surface user feedback (notifyError /
        # ElMessage) or be listed with a justification in the exemption table.
        run: node scripts/check-silent-catch.mjs

      - name: Run unit tests
        working-directory: frontend
        # Enforces coverage thresholds defined in vitest.config.js.
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node version
        working-directory: frontend
        run: npm run check:node

      - name: Install dependencies (lockfile-exact)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E tests (chromium + firefox + webkit + mobile)
        working-directory: frontend
        # Builds the app and serves it via vite preview; API calls are mocked
        # by the suite (e2e/support/mockApi.js) so no live backend is needed.
        # PW_BROWSERS=all runs the full desktop + mobile matrix.
        env:
          PW_BROWSERS: all
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-integration:
    name: Backend (HTTP integration tests)
    runs-on: ubuntu-latest
    needs: repo-hygiene

    # The integration runner owns run-labeled disposable MySQL/Redis
    # containers; no host DB service is shared with the test process.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config \
            libssl-dev default-mysql-client ripgrep

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('backend_cpp/vcpkg.json', 'backend_cpp/vcpkg-configuration.json', 'backend_cpp/vcpkg-overlay-ports/**') }}

      - name: Checkout pinned vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          git -C "$HOME/vcpkg" fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C "$HOME/vcpkg" checkout --detach "$VCPKG_BASELINE"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "vcpkg at $(git -C "$HOME/vcpkg" rev-parse HEAD)"

      - name: Build backend
        working-directory: backend_cpp
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DWONIUNOTE_ENABLE_TEST_CHALLENGE=ON \
            -DWONIUNOTE_ENABLE_TEST_AUTH_FAULTS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build -j$(nproc) --target woniunote_backend

      - name: Install Python test deps
        run: pip install --quiet requests pytest pymysql redis

      - name: Run isolated real backend and Chromium suite
        run: bash backend_cpp/tests/integration/run_integration.sh
        env:
          WONIUNOTE_TEST_STRICT: "1"
          WONIUNOTE_TEST_REAL_E2E: "1"
          TMPDIR: /tmp

      - name: Verify the product-default rate limit in a fresh service pair
        id: rate_limit_default
        run: bash backend_cpp/tests/integration/run_integration.sh
        env:
          WONIUNOTE_TEST_STRICT: "1"
          WONIUNOTE_TEST_SCENARIO: rate-limit
          TMPDIR: /tmp

      - name: Diagnose the product-default rate limit under sanitizers
        if: failure() && steps.rate_limit_default.outcome == 'failure'
        run: |
          cmake -S backend_cpp -B backend_cpp/build -DBUILD_TESTING=ON \
            -DWONIUNOTE_ENABLE_TEST_CHALLENGE=ON \
            -DWONIUNOTE_ENABLE_TEST_AUTH_FAULTS=ON \
            -DENABLE_SANITIZERS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build backend_cpp/build -j2 --target woniunote_backend
          WONIUNOTE_TEST_STRICT=1 \
          WONIUNOTE_TEST_SCENARIO=rate-limit \
          TMPDIR=/tmp \
          WONIUNOTE_BACKEND_BIN="$GITHUB_WORKSPACE/backend_cpp/build/woniunote_backend" \
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=0:symbolize=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            bash backend_cpp/tests/integration/run_integration.sh

      - name: Upload redacted Iteration 21 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter21-real-backend-evidence
          path: /tmp/woniunote-iter21/results
          retention-days: 7
