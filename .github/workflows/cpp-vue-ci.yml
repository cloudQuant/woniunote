name: WoniuNote C++/Vue CI

# CI for the active dev_cpp stack: C++ Drogon backend + Vue 3 frontend.
# The legacy Flask CI lives in ci.yml and is unaffected.

on:
  push:
    branches: [ dev_cpp, master, main ]
  pull_request:
    branches: [ dev_cpp, master, main ]

jobs:
  backend-cpp:
    name: Backend (C++ build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config \
            libssl-dev

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('backend_cpp/vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        working-directory: backend_cpp
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        working-directory: backend_cpp
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        working-directory: backend_cpp/build
        run: ctest --output-on-failure

  backend-static-analysis:
    name: Backend (cppcheck static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Static analysis as a quality signal. Reports issues but does not fail
      # the build yet (--error-exitcode=0); tighten to 1 once the baseline is clean.
      - name: Run cppcheck
        working-directory: backend_cpp
        run: |
          cppcheck --enable=warning,performance,portability \
            --std=c++17 --language=c++ --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            -I core -I controllers -I filters -I models \
            controllers core filters models main.cc

  frontend-vue:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Audit dependencies
        working-directory: frontend
        # Supply-chain gate: fail only on high/critical advisories.
        run: npm audit --audit-level=high || true

      - name: Lint
        working-directory: frontend
        # Quality signal; surfaces real bugs (errors fail, warnings do not).
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        # Enforces coverage thresholds defined in vitest.config.js.
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        # Builds the app and serves it via vite preview; API calls are mocked
        # by the suite (e2e/support/mockApi.js) so no live backend is needed.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
