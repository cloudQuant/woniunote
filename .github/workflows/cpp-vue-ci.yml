name: WoniuNote C++/Vue CI

# CI for the active dev_cpp stack: C++ Drogon backend + Vue 3 frontend.
# Legacy Flask workflows are manual no-op notices and do not run automatically.

on:
  push:
    branches: [ dev_cpp, master, main ]
  pull_request:
    branches: [ dev_cpp, master, main ]

jobs:
  repo-hygiene:
    name: Repo hygiene (tracked secrets + generated artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block tracked secrets and generated artifacts
        run: |
          set -euo pipefail
          tracked="$(
            {
              git ls-files '*.key' '*.pem' '*.crt' '*.csr'
              git ls-files backups
              git ls-files coverage.json coverage.xml
              git ls-files tests/test_db
              git ls-files configs/mysql_test_config.yaml tests/configs/user_password_config.yaml
            } | sort -u
          )"
          if [ -n "$tracked" ]; then
            echo "The following sensitive/generated files are tracked and must be removed:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          if git grep -n -I -E 'BEGIN ((RSA|EC|OPENSSH) )?PRIVATE KEY' -- . ':!frontend/package-lock.json'; then
            echo "Potential private key material found in tracked files." >&2
            exit 1
          fi

  backend-cpp:
    name: Backend (C++ build + tests)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config \
            libssl-dev

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('backend_cpp/vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        working-directory: backend_cpp
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        working-directory: backend_cpp
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        working-directory: backend_cpp/build
        run: ctest --output-on-failure

  backend-static-analysis:
    name: Backend (cppcheck static analysis)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Static analysis as a real gate. The baseline is clean (iteration 13),
      # so any newly-introduced warning/perf/portability issue fails the build.
      # Informational branch-limit notes are suppressed (not real findings).
      - name: Run cppcheck (blocking)
        working-directory: backend_cpp
        run: |
          cppcheck --enable=warning,performance,portability \
            --std=c++17 --language=c++ --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --error-exitcode=1 \
            -I core -I controllers -I filters -I models \
            controllers core filters models main.cc

  frontend-vue:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Audit production dependencies (blocking)
        working-directory: frontend
        # Supply-chain gate: fail on high/critical advisories in *runtime*
        # dependencies. Iteration 14 tightens this to moderate now that the
        # PostCSS baseline is fixed in package-lock.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (advisory only)
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Lint
        working-directory: frontend
        # Iteration 14 drives the warning baseline to zero.
        run: npm run lint:ci

      - name: Run unit tests
        working-directory: frontend
        # Enforces coverage thresholds defined in vitest.config.js.
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E tests (chromium + firefox + webkit + mobile)
        working-directory: frontend
        # Builds the app and serves it via vite preview; API calls are mocked
        # by the suite (e2e/support/mockApi.js) so no live backend is needed.
        # PW_BROWSERS=all runs the full desktop + mobile matrix.
        env:
          PW_BROWSERS: all
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-integration:
    name: Backend (HTTP integration tests)
    runs-on: ubuntu-latest
    needs: repo-hygiene

    # Live dependencies for the real backend: MySQL holds the isolated test
    # schema; Redis backs rate limiting and refresh-token rotation.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testrootpw
          MYSQL_DATABASE: woniunote_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestrootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config \
            libssl-dev default-mysql-client

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('backend_cpp/vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      - name: Build backend
        working-directory: backend_cpp
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build -j$(nproc) --target woniunote_backend

      - name: Install Python test deps
        run: pip install --quiet requests pytest

      - name: Run integration tests
        run: bash backend_cpp/tests/integration/run_integration.sh
        env:
          WONIUNOTE_TEST_DB_HOST: 127.0.0.1
          WONIUNOTE_TEST_DB_PORT: "3306"
          WONIUNOTE_TEST_DB_USER: root
          WONIUNOTE_TEST_DB_PASSWORD: testrootpw
          WONIUNOTE_TEST_DB_NAME: woniunote_test
          WONIUNOTE_TEST_REDIS_HOST: 127.0.0.1
          WONIUNOTE_TEST_REDIS_PORT: "6379"
          WONIUNOTE_TEST_PORT: "5273"
          WONIUNOTE_TEST_RATE_LIMIT: "30"
          PYTEST_CMD: "python -m pytest -p no:cacheprovider -o addopts=''"
