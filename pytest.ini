[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = . woniunote

# 测试配置选项
addopts =
    -v
    --tb=short
    --disable-warnings
    --timeout=10
    --timeout-method=thread
    --strict-markers
    --cov=woniunote
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=80
    --cov-branch

# 测试标记
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks unit tests
    functional: marks functional tests
    integration: marks integration tests
    browser: marks tests that use a browser (deselect with '-m "not browser"')
    security: marks security-related tests
    performance: marks performance tests
    database: marks database-related tests
    api: marks API tests
    critical: marks critical path tests

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestDeprecationWarning
    ignore:pkg_resources is deprecated:DeprecationWarning
    ignore:.*Working outside of application context.*:Warning
    ignore:.*Working outside of request context.*:Warning

# 覆盖率配置
[coverage:run]
source = woniunote
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=woniunote --cov-report=html --cov-report=term-missing
