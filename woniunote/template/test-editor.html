{% extends 'base.html' %}

{% block content %}
<div class="container" style="margin-top: 20px; background-color: white; padding: 20px;">
    <h2>UEditor编辑器测试页面</h2>
    
    <div id="status" style="padding: 10px; margin: 10px 0; background: #f0f0f0; border-radius: 5px;">
        正在初始化编辑器...
    </div>
    
    <div style="margin: 20px 0;">
        <label for="title">测试标题：</label><br>
        <input type="text" id="title" class="form-control" placeholder="请输入测试标题" value="测试文章标题">
    </div>
    
    <div style="margin: 20px 0;">
        <label for="content">编辑器内容：</label><br>
        <script id="content" name="content" type="text/plain" style="width:100%;height:400px;">
            <p>这是UEditor编辑器的测试内容。</p>
            <p>如果您能看到这个富文本编辑器，说明UEditor已经正常工作。</p>
        </script>
    </div>
    
    <div style="margin: 20px 0;">
        <button class="btn btn-primary" onclick="testGetContent()">获取内容</button>
        <button class="btn btn-secondary" onclick="testSetContent()">设置内容</button>
        <button class="btn btn-info" onclick="checkEditorStatus()">检查状态</button>
    </div>
    
    <div id="output" style="margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 5px; min-height: 100px;">
        <strong>输出区域：</strong><br>
        等待操作...
    </div>
</div>

<script type="text/javascript">
    // 设置UEditor路径
    window.UEDITOR_HOME_URL = '/resource/ueditor/';
    console.log('设置UEditor路径:', window.UEDITOR_HOME_URL);
    
    function updateStatus(message, isError = false) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = message;
        statusDiv.style.background = isError ? '#f8d7da' : '#d4edda';
        statusDiv.style.color = isError ? '#721c24' : '#155724';
        console.log('[状态]', message);
    }
    
    function updateOutput(content) {
        document.getElementById('output').innerHTML = '<strong>输出结果：</strong><br>' + content;
    }
</script>

<script type="text/javascript" src="/resource/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="/resource/ueditor/ueditor.all.js"></script>

<script type="text/javascript">
    let ue = null;
    let initAttempts = 0;
    const maxAttempts = 10;
    
    function initEditor() {
        initAttempts++;
        updateStatus(`尝试初始化编辑器 (第${initAttempts}次)...`);
        
        // 检查UE对象
        if (typeof UE === 'undefined') {
            updateStatus(`UE对象未定义，等待脚本加载... (${initAttempts}/${maxAttempts})`, true);
            if (initAttempts < maxAttempts) {
                setTimeout(initEditor, 1000);
            } else {
                updateStatus('UE对象加载失败，请检查网络连接和脚本路径', true);
            }
            return;
        }
        
        updateStatus('UE对象已加载，创建编辑器实例...');
        console.log('UE版本:', UE.version);
        
        // 检查容器元素
        const container = document.getElementById('content');
        if (!container) {
            updateStatus('找不到编辑器容器元素 #content', true);
            return;
        }
        
        console.log('找到编辑器容器:', container);
        
        try {
            // 销毁已存在的编辑器实例
            if (ue) {
                console.log('销毁现有编辑器实例...');
                ue.destroy();
                ue = null;
            }
            
            // 创建新的编辑器实例
            ue = UE.getEditor('content', {
                initialFrameHeight: 400,
                autoHeightEnabled: false,
                serverUrl: '/uedit',
                // 添加一些配置确保编辑器正常显示
                elementPathEnabled: false,
                wordCount: false,
                maximumWords: 50000
            });
            
            // 监听编辑器就绪事件
            ue.ready(function() {
                updateStatus('✅ UEditor编辑器初始化成功！');
                console.log('编辑器实例:', ue);
                console.log('编辑器容器:', ue.container);
                
                // 设置一些测试内容
                setTimeout(() => {
                    if (ue && ue.setContent) {
                        ue.setContent('<p>UEditor编辑器已成功初始化！您可以开始编辑内容了。</p>');
                    }
                }, 500);
            });
            
            // 监听编辑器错误
            ue.addListener('error', function(type, error) {
                console.error('UEditor错误:', type, error);
                updateStatus('编辑器发生错误: ' + error, true);
            });
            
        } catch (e) {
            updateStatus('创建编辑器时发生异常: ' + e.message, true);
            console.error('编辑器创建异常:', e);
        }
    }
    
    function testGetContent() {
        if (ue && ue.getContent) {
            try {
                const htmlContent = ue.getContent();
                const textContent = ue.getContentTxt();
                updateOutput(`
                    <p><strong>HTML内容长度:</strong> ${htmlContent.length}</p>
                    <p><strong>纯文本长度:</strong> ${textContent.length}</p>
                    <hr>
                    <p><strong>HTML内容:</strong></p>
                    <div style="border: 1px solid #ccc; padding: 10px; background: white; max-height: 200px; overflow-y: auto;">
                        ${htmlContent}
                    </div>
                    <p><strong>纯文本内容:</strong></p>
                    <div style="border: 1px solid #ccc; padding: 10px; background: white; max-height: 100px; overflow-y: auto;">
                        ${textContent}
                    </div>
                `);
            } catch (e) {
                updateOutput('获取内容时发生错误: ' + e.message);
            }
        } else {
            updateOutput('编辑器未就绪或不可用');
        }
    }
    
    function testSetContent() {
        if (ue && ue.setContent) {
            try {
                const testContent = `
                    <h3>测试内容 - ${new Date().toLocaleTimeString()}</h3>
                    <p>这是通过JavaScript设置的<strong>测试内容</strong>。</p>
                    <ul>
                        <li>支持<em>富文本</em>编辑</li>
                        <li>支持<span style="color: red;">颜色</span>设置</li>
                        <li>支持各种格式</li>
                    </ul>
                    <p>编辑器工作正常！</p>
                `;
                ue.setContent(testContent);
                updateOutput('✅ 已成功设置测试内容到编辑器');
            } catch (e) {
                updateOutput('设置内容时发生错误: ' + e.message);
            }
        } else {
            updateOutput('编辑器未就绪或不可用');
        }
    }
    
    function checkEditorStatus() {
        const status = {
            'UE全局对象存在': typeof UE !== 'undefined' ? '✅ 是' : '❌ 否',
            'UE版本': typeof UE !== 'undefined' && UE.version ? UE.version : '未知',
            'ue实例存在': ue ? '✅ 是' : '❌ 否',
            '编辑器是否就绪': ue && ue.isReady ? '✅ 是' : '❌ 否',
            'getContent方法': ue && ue.getContent ? '✅ 可用' : '❌ 不可用',
            'setContent方法': ue && ue.setContent ? '✅ 可用' : '❌ 不可用',
            'getContentTxt方法': ue && ue.getContentTxt ? '✅ 可用' : '❌ 不可用',
            '编辑器容器': ue && ue.container ? '✅ 已创建' : '❌ 未创建'
        };
        
        let output = '<h4>编辑器状态检查:</h4>';
        for (const [key, value] of Object.entries(status)) {
            output += `<p><strong>${key}:</strong> ${value}</p>`;
        }
        
        updateOutput(output);
    }
    
    // 页面加载完成后初始化编辑器
    $(document).ready(function() {
        console.log('页面DOM加载完成，准备初始化编辑器...');
        setTimeout(initEditor, 1000);
    });
</script>
{% endblock %}
