<!DOCTYPE html>
<html>
<head>
    <title>UEditor测试页面</title>
    <meta charset="utf-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>UEditor测试页面</h1>
    
    <div style="margin: 20px;">
        <h2>编辑器容器：</h2>
        <script id="editor" type="text/plain" style="width:100%;height:400px;"></script>
    </div>
    
    <div style="margin: 20px;">
        <button onclick="getContent()">获取内容</button>
        <button onclick="setContent()">设置内容</button>
    </div>
    
    <div id="result" style="margin: 20px; padding: 10px; border: 1px solid #ccc;">
        <h3>结果：</h3>
        <div id="content"></div>
    </div>

    <!-- 引入UEditor -->
    <script type="text/javascript">
        window.UEDITOR_HOME_URL = '/resource/ueditor/';
    </script>
    <script type="text/javascript" src="/resource/ueditor/ueditor.config.js"></script>
    <script type="text/javascript" src="/resource/ueditor/ueditor.all.js"></script>
    
    <script type="text/javascript">
        var ue = null;
        
        // 初始化编辑器
        $(document).ready(function() {
            console.log('开始初始化UEditor...');
            
            // 检查UE对象
            if (typeof UE === 'undefined') {
                $('#content').html('<p style="color:red">错误：UE对象未定义，UEditor脚本加载失败！</p>');
                return;
            }
            
            try {
                // 获取当前协议
                var protocol = window.location.protocol;
                var host = window.location.hostname;
                var port = window.location.port;
                var serverUrl = protocol + '//' + host + ':' + port + '/uedit';
                
                console.log('服务器URL:', serverUrl);
                
                // 创建编辑器实例
                ue = UE.getEditor('editor', {
                    serverUrl: serverUrl,
                    initialFrameHeight: 400,
                    autoHeightEnabled: false
                });
                
                // 编辑器准备就绪
                ue.ready(function() {
                    console.log('UEditor初始化成功！');
                    $('#content').html('<p style="color:green">编辑器初始化成功！</p>');
                });
                
            } catch(e) {
                console.error('初始化失败:', e);
                $('#content').html('<p style="color:red">错误：' + e.message + '</p>');
            }
        });
        
        // 获取编辑器内容
        function getContent() {
            if (ue) {
                var content = ue.getContent();
                $('#content').html('<h4>获取的内容：</h4>' + content);
            } else {
                alert('编辑器未初始化');
            }
        }
        
        // 设置编辑器内容
        function setContent() {
            if (ue) {
                ue.setContent('<h1>测试内容</h1><p>这是通过JavaScript设置的内容。</p>');
                $('#content').html('<p style="color:blue">内容已设置</p>');
            } else {
                alert('编辑器未初始化');
            }
        }
    </script>
</body>
</html>
