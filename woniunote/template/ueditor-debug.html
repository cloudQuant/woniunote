{% extends 'base.html' %}

{% block content %}
<div class="container" style="margin-top: 20px; background-color: white; padding: 20px;">
    <h2>🔧 UEditor编辑器调试页面</h2>
    
    <div class="alert alert-info">
        <strong>调试信息：</strong>此页面用于检测UEditor编辑器的完整显示问题
    </div>
    
    <!-- 系统信息显示 -->
    <div class="card mb-3">
        <div class="card-header">系统信息</div>
        <div class="card-body">
            <div id="system-info">
                <p><strong>浏览器：</strong><span id="browser-info">检测中...</span></p>
                <p><strong>屏幕分辨率：</strong><span id="screen-info">检测中...</span></p>
                <p><strong>页面加载时间：</strong><span id="load-time">检测中...</span></p>
            </div>
        </div>
    </div>
    
    <!-- UEditor状态显示 -->
    <div class="card mb-3">
        <div class="card-header">UEditor状态</div>
        <div class="card-body">
            <div id="ueditor-debug-info">
                <p><strong>UE对象：</strong><span id="ue-status">检测中...</span></p>
                <p><strong>编辑器实例：</strong><span id="editor-status">检测中...</span></p>
                <p><strong>初始化状态：</strong><span id="init-status">检测中...</span></p>
            </div>
        </div>
    </div>
    
    <!-- 编辑器区域 -->
    <div class="form-group">
        <label for="content"><h4>📝 UEditor编辑器</h4></label>
        <div id="ueditor-container" style="border: 2px solid #007bff; min-height: 500px; background: #fff; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <div id="ueditor-status" style="padding: 15px; background: #e3f2fd; border: 1px solid #2196f3; border-radius: 4px; margin-bottom: 20px; font-size: 16px; color: #1565c0; text-align: center;">
                🔄 正在初始化UEditor编辑器，请稍候...
            </div>
            <div style="clear: both; width: 100%; min-height: 450px; position: relative;">
                <script id="content" name="content" type="text/plain" style="width:100%;height:450px;">
                    <h2>🎉 UEditor编辑器测试内容</h2>
                    <p>如果您能看到这个富文本编辑器，说明UEditor已经<strong>成功加载</strong>！</p>
                    <ul>
                        <li>✅ 工具栏应该完整显示</li>
                        <li>✅ 编辑区域应该可以正常编辑</li>
                        <li>✅ 所有功能按钮应该可以点击</li>
                    </ul>
                    <p style="color: #28a745;">请尝试编辑这些内容，测试编辑器功能！</p>
                </script>
            </div>
        </div>
    </div>
    
    <!-- 功能测试按钮 -->
    <div class="row mb-3">
        <div class="col-12">
            <h4>🧪 功能测试</h4>
            <button class="btn btn-primary mr-2" onclick="testGetContent()">获取内容</button>
            <button class="btn btn-secondary mr-2" onclick="testSetContent()">设置内容</button>
            <button class="btn btn-info mr-2" onclick="testEditorHeight()">调整高度</button>
            <button class="btn btn-success mr-2" onclick="testFullscreen()">全屏模式</button>
            <button class="btn btn-warning mr-2" onclick="refreshEditor()">重新加载</button>
        </div>
    </div>
    
    <!-- 测试结果显示 -->
    <div class="card">
        <div class="card-header">测试结果</div>
        <div class="card-body">
            <div id="test-output" style="background: #f8f9fa; padding: 15px; border-radius: 4px; min-height: 100px; font-family: monospace;">
                等待测试操作...
            </div>
        </div>
    </div>
</div>

<!-- UEditor编辑器样式优化 -->
<style>
    /* 确保UEditor容器正确显示 */
    #ueditor-container {
        position: relative;
        z-index: 1;
    }
    
    /* UEditor编辑器样式 */
    .edui-default {
        width: 100% !important;
        min-height: 450px !important;
        border: 1px solid #ddd !important;
        border-radius: 4px !important;
    }
    
    /* 编辑器工具栏样式 */
    .edui-toolbar {
        border: 1px solid #ddd !important;
        border-bottom: none !important;
        background: #f8f9fa !important;
        border-radius: 4px 4px 0 0 !important;
    }
    
    /* 编辑器内容区域样式 */
    .edui-editor-body {
        border: 1px solid #ddd !important;
        border-top: none !important;
        border-bottom: none !important;
        background: #fff !important;
    }
    
    /* 编辑器iframe样式 */
    .edui-editor-iframeholder iframe {
        width: 100% !important;
        min-height: 400px !important;
        border: none !important;
    }
    
    /* 状态栏样式 */
    .edui-editor-bottomContainer {
        border: 1px solid #ddd !important;
        border-top: none !important;
        background: #f8f9fa !important;
        border-radius: 0 0 4px 4px !important;
    }
    
    /* 确保按钮间距 */
    .mr-2 {
        margin-right: 0.5rem !important;
    }
</style>

<script type="text/javascript">
    // 页面加载信息
    const startTime = Date.now();
    
    // 更新系统信息
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('browser-info').textContent = navigator.userAgent;
        document.getElementById('screen-info').textContent = screen.width + 'x' + screen.height;
        document.getElementById('load-time').textContent = (Date.now() - startTime) + 'ms';
    });
    
    // 设置UEditor路径
    window.UEDITOR_HOME_URL = '/resource/ueditor/';
    console.log('🔧 设置UEditor路径:', window.UEDITOR_HOME_URL);
    
    function updateOutput(content) {
        document.getElementById('test-output').innerHTML = content;
    }
    
    function updateUEStatus() {
        document.getElementById('ue-status').innerHTML = typeof UE !== 'undefined' ? 
            `<span class="text-success">✅ 已加载 (版本: ${UE.version || '未知'})</span>` : 
            '<span class="text-danger">❌ 未加载</span>';
            
        document.getElementById('editor-status').innerHTML = window.ue ? 
            '<span class="text-success">✅ 已创建</span>' : 
            '<span class="text-warning">⏳ 未创建</span>';
            
        document.getElementById('init-status').innerHTML = window.editorInitialized ? 
            '<span class="text-success">✅ 已完成</span>' : 
            '<span class="text-warning">⏳ 进行中</span>';
    }
    
    // 定期更新状态
    setInterval(updateUEStatus, 1000);
</script>

<script type="text/javascript" src="/resource/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="/resource/ueditor/ueditor.all.js"></script>

<script type="text/javascript">
    let ue = null;
    let editorInitialized = false;
    
    // 更新状态显示
    function updateStatus(message, isError = false) {
        const statusDiv = document.getElementById('ueditor-status');
        if (statusDiv) {
            statusDiv.innerHTML = (isError ? '❌ ' : '🔄 ') + message;
            statusDiv.style.background = isError ? '#ffebee' : '#e3f2fd';
            statusDiv.style.borderColor = isError ? '#f44336' : '#2196f3';
            statusDiv.style.color = isError ? '#c62828' : '#1565c0';
        }
        console.log('[UEditor状态]', message);
    }
    
    // 等待DOM和脚本加载完成后初始化编辑器
    function initEditor() {
        if (editorInitialized) {
            updateStatus('编辑器已经初始化过了');
            return;
        }
        
        updateStatus('开始初始化UEditor编辑器...');
        
        if (typeof UE === 'undefined') {
            updateStatus('等待UEditor脚本加载...', true);
            setTimeout(initEditor, 500);
            return;
        }
        
        var container = document.getElementById('content');
        if (!container) {
            updateStatus('错误：找不到编辑器容器元素', true);
            return;
        }
        
        updateStatus(`UEditor脚本已加载 (版本: ${UE.version || '未知'})`);
        
        try {
            // 销毁已存在的编辑器实例
            if (ue) {
                console.log('销毁现有编辑器实例...');
                ue.destroy();
                ue = null;
            }
            
            updateStatus('正在创建编辑器实例...');
            
            ue = UE.getEditor('content', {
                // 编辑器尺寸配置
                initialFrameHeight: 400,
                initialFrameWidth: '100%',
                autoHeightEnabled: false,
                minFrameHeight: 300,
                maxFrameHeight: 600,
                
                // 服务器配置
                serverUrl: '/uedit',
                
                // 界面配置
                elementPathEnabled: true,
                wordCount: true,
                maximumWords: 50000,
                
                // 确保编辑器完整显示
                scaleEnabled: true,
                
                // 完整工具栏配置
                toolbars: [[
                    'fullscreen', 'source', '|',
                    'undo', 'redo', '|',
                    'bold', 'italic', 'underline', 'strikethrough', '|',
                    'forecolor', 'backcolor', '|',
                    'insertorderedlist', 'insertunorderedlist', '|',
                    'justifyleft', 'justifycenter', 'justifyright', 'justifyjustify', '|',
                    'fontfamily', 'fontsize', '|',
                    'indent', '|',
                    'link', 'unlink', '|',
                    'simpleupload', 'insertimage', '|',
                    'inserttable', '|',
                    'horizontal', 'date', 'time', '|',
                    'removeformat', 'cleardoc'
                ]],
                
                // 确保编辑器正常渲染
                focus: false,
                tabSize: 4
            });
            
            // 监听编辑器就绪事件
            ue.ready(function() {
                updateStatus('✅ UEditor编辑器初始化成功！功能完整可用');
                editorInitialized = true;
                
                console.log('🎉 编辑器初始化完成');
                console.log('编辑器容器:', ue.container);
                console.log('编辑器iframe:', ue.iframe);
                
                // 确保编辑器完整显示
                setTimeout(() => {
                    try {
                        // 调整编辑器高度
                        if (ue.setHeight) {
                            ue.setHeight(400);
                        }
                        
                        console.log('✅ 编辑器设置完成');
                        
                    } catch (e) {
                        console.error('设置编辑器时出错:', e);
                    }
                }, 500);
                
                // 5秒后隐藏状态提示
                setTimeout(() => {
                    const statusDiv = document.getElementById('ueditor-status');
                    if (statusDiv) {
                        statusDiv.style.display = 'none';
                    }
                }, 5000);
            });
            
            // 监听编辑器错误
            ue.addListener('error', function(type, error) {
                updateStatus(`编辑器错误: ${type} - ${error}`, true);
                console.error('UEditor错误:', type, error);
            });
            
        } catch (e) {
            updateStatus(`创建编辑器异常: ${e.message}`, true);
            console.error('创建编辑器时发生异常:', e);
        }
    }
    
    // 测试函数
    function testGetContent() {
        if (ue && ue.getContent) {
            const htmlContent = ue.getContent();
            const textContent = ue.getContentTxt();
            updateOutput(`
                <strong>获取内容测试：</strong><br>
                HTML内容长度: ${htmlContent.length} 字符<br>
                纯文本长度: ${textContent.length} 字符<br>
                <hr>
                <strong>HTML内容预览：</strong><br>
                <div style="max-height: 200px; overflow-y: auto; background: white; padding: 10px; border: 1px solid #ddd;">
                    ${htmlContent}
                </div>
            `);
        } else {
            updateOutput('<span class="text-danger">❌ 编辑器未就绪</span>');
        }
    }
    
    function testSetContent() {
        if (ue && ue.setContent) {
            const testContent = `
                <h3>🧪 测试内容 - ${new Date().toLocaleString()}</h3>
                <p>这是通过JavaScript设置的<strong>测试内容</strong>。</p>
                <ul>
                    <li>支持<em>富文本</em>编辑</li>
                    <li>支持<span style="color: red;">颜色</span>设置</li>
                    <li>支持各种格式化功能</li>
                </ul>
                <p style="background: #ffffcc; padding: 10px;">编辑器功能测试正常！</p>
            `;
            ue.setContent(testContent);
            updateOutput('<span class="text-success">✅ 已设置测试内容到编辑器</span>');
        } else {
            updateOutput('<span class="text-danger">❌ 编辑器未就绪</span>');
        }
    }
    
    function testEditorHeight() {
        if (ue && ue.setHeight) {
            const newHeight = 500;
            ue.setHeight(newHeight);
            updateOutput(`<span class="text-success">✅ 已调整编辑器高度为 ${newHeight}px</span>`);
        } else {
            updateOutput('<span class="text-danger">❌ 编辑器未就绪或不支持高度调整</span>');
        }
    }
    
    function testFullscreen() {
        if (ue && ue.execCommand) {
            ue.execCommand('fullscreen');
            updateOutput('<span class="text-success">✅ 已切换全屏模式</span>');
        } else {
            updateOutput('<span class="text-danger">❌ 编辑器未就绪</span>');
        }
    }
    
    function refreshEditor() {
        editorInitialized = false;
        if (ue) {
            ue.destroy();
            ue = null;
        }
        updateOutput('<span class="text-info">🔄 正在重新加载编辑器...</span>');
        setTimeout(initEditor, 1000);
    }
    
    // 确保jQuery和其他依赖已加载后再初始化编辑器
    $(document).ready(function() {
        console.log('🔧 页面DOM加载完成，准备初始化UEditor编辑器...');
        setTimeout(initEditor, 2000); // 延迟2秒确保所有脚本都已加载
    });
</script>

{% endblock %}
