<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
        .wrapper {
            width: 600px;
            padding: 10px;
            height: 352px;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #d7d7d7;
        }
        .wrapper .file-upload {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .wrapper .file-upload .file-tip {
            color: #999;
            font-size: 12px;
            padding-left: 10px;
            flex-grow: 1;
        }
        .wrapper .file-manual {
            background: #EEE;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            line-height: 2;
        }
        .wrapper .file-manual .title {
            font-weight: bold;
            font-size: 120%;
        }
        .wrapper .file-manual .body li {
            list-style: disc;
            margin-left: 20px;
        }
        .wrapper .upload-button {
            width: 100px;
            height: 30px;
            background-color: #F8F8F8;
            border: 1px solid #EEE;
            border-radius: 4px;
            text-align: center;
            line-height: 28px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-right: 5px;
        }
        .wrapper .upload-button .text {
            display: inline-block;
            vertical-align: middle;
        }
        .wrapper .upload-button input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }
        .wrapper .file-result {
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
            position: absolute;
            left: 10px;
            right: 10px;
            top: 50px;
            background: #FFF;
            bottom: 10px;
            overflow: auto;
            display: none;
        }
        .wrapper .file-input{
            position: absolute;
            left: 10px;
            right: 10px;
            top: 50px;
            background: #EEE;
            bottom: 10px;
            border-radius: 5px;
            display:none;
        }
        .wrapper .file-input textarea{
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 50px;
            border: none;
            resize: none;
            border-radius: 5px;
            padding: 5px;
            outline: none;
            top: 30px;
            font-family: monospace;
        }
        .wrapper .file-input .tool{
            position: absolute;
            bottom: 10px;
            right: 10px;
            text-align: right;
            padding: 5px 10px;
        }
        .wrapper .file-input .tool a{
            display: inline-block;
            text-decoration: none;
            color: #333;
            background: #FFF;
            padding: 5px 15px;
            line-height: 20px;
            border-radius: 3px;
            margin-left: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .wrapper .file-input .tool a:hover{
            background: #f0f0f0;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="file-upload">
        <div class="upload-button">
            <div class="text">选择本地文件</div>
            <input type="file" id="contentImport" accept=".md,.txt,.docx"/>
        </div>
        <div class="upload-button">
            <div class="text" onclick="showMarkdownInput()">粘贴Markdown</div>
        </div>
        <div class="file-tip"></div>
    </div>
    <div class="file-manual">
        <div class="title">
            支持文档格式
        </div>
        <div class="body">
            <ul>
                <li><b>Markdown</b>：md、txt文件</li>
                <li><b>Word文档</b>：docx（基础支持）</li>
                <li><b>直接粘贴</b>：Markdown文本内容</li>
            </ul>
        </div>
    </div>
    <div class="file-result"></div>
    <div class="file-input">
        <textarea id="fileInputContent" placeholder="在此粘贴Markdown内容...

支持的语法：
# 标题1
## 标题2
### 标题3

**粗体** *斜体* ~~删除线~~

- 无序列表
1. 有序列表

[链接](http://example.com)
![图片](image.jpg)

```
代码块
```

`行内代码`

> 引用内容"></textarea>
        <div class="tool">
            <a href="javascript:;" onclick="convertMarkdown()">转换预览</a>
            <a href="javascript:;" onclick="hideMarkdownInput()">关闭</a>
        </div>
    </div>
</div>

<script type="text/javascript">
// 全局变量
var contentImport = {
    data: {
        result: null
    }
};

// 简化的DOM选择器
function $(selector) {
    return document.querySelector(selector);
}

// Markdown转换函数
function convertMarkdown(markdown) {
    var html = markdown;
    
    // 保存代码块
    var codeBlocks = [];
    var codeIndex = 0;
    html = html.replace(/```([\w]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        var placeholder = '___CODEBLOCK_' + (codeIndex++) + '___';
        codeBlocks.push({
            lang: lang || 'plaintext',
            code: code.trim()
        });
        return placeholder;
    });
    
    // 保存行内代码
    var inlineCodes = [];
    var inlineIndex = 0;
    html = html.replace(/`([^`]+)`/g, function(match, code) {
        var placeholder = '___INLINE_' + (inlineIndex++) + '___';
        inlineCodes.push(code);
        return placeholder;
    });
    
    // 转换标题
    html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
    
    // 转换粗体和斜体
    html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
    
    // 转换列表
    html = html.replace(/^\* (.*?)$/gm, '<li>$1</li>');
    html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');
    html = html.replace(/^\d+\. (.*?)$/gm, '<li>$1</li>');
    
    // 包装列表
    html = html.replace(/(<li>.*?<\/li>\n?)+/g, function(match) {
        return '<ul>' + match + '</ul>';
    });
    
    // 转换链接和图片
    html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;" />');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    
    // 转换引用
    html = html.replace(/^> (.*?)$/gm, '<blockquote style="border-left:4px solid #ddd; margin:0; padding-left:16px; color:#666;">$1</blockquote>');
    
    // 转换水平线
    html = html.replace(/^---$/gm, '<hr style="border:none; border-top:1px solid #ccc; margin:20px 0;">');
    html = html.replace(/^\*\*\*$/gm, '<hr style="border:none; border-top:1px solid #ccc; margin:20px 0;">');
    
    // 转换段落
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';
    
    // 清理多余的标签
    html = html.replace(/<p><\/p>/g, '');
    html = html.replace(/<p>(<h[1-6]>)/g, '$1');
    html = html.replace(/(<\/h[1-6]>)<\/p>/g, '$1');
    html = html.replace(/<p>(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)<\/p>/g, '$1');
    html = html.replace(/<p>(<blockquote)/g, '$1');
    html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
    html = html.replace(/<p>(<hr)/g, '$1');
    html = html.replace(/(<hr[^>]*>)<\/p>/g, '$1');
    
    // 还原代码块
    codeBlocks.forEach(function(block, index) {
        var placeholder = '___CODEBLOCK_' + index + '___';
        var codeHtml = '<pre style="background:#f5f5f5; padding:10px; border-radius:3px; overflow-x:auto;"><code class="language-' + block.lang + '">' +
                      block.code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                      '</code></pre>';
        html = html.replace(placeholder, codeHtml);
    });
    
    // 还原行内代码
    inlineCodes.forEach(function(code, index) {
        var placeholder = '___INLINE_' + index + '___';
        var codeHtml = '<code style="background:#f5f5f5; padding:2px 4px; border-radius:3px; font-family:monospace;">' +
                      code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                      '</code>';
        html = html.replace(placeholder, codeHtml);
    });
    
    return html;
}

// UI函数
function showMarkdownInput() {
    $('.file-input').style.display = 'block';
    $('.file-tip').innerHTML = '';
    $('#fileInputContent').focus();
}

function hideMarkdownInput() {
    $('.file-input').style.display = 'none';
}

function convertMarkdown() {
    var textarea = $('#fileInputContent');
    var markdown = textarea.value;
    
    if (!markdown.trim()) {
        $('.file-tip').innerHTML = '请输入Markdown内容';
        return;
    }
    
    var html = convertMarkdown(markdown);
    contentImport.data.result = html;
    
    $('.file-result').innerHTML = html;
    $('.file-result').style.display = 'block';
    $('.file-input').style.display = 'none';
    $('.file-tip').innerHTML = '转换成功！点击下方"确认"按钮插入内容到编辑器。';
}

// 文件上传处理
document.getElementById('contentImport').addEventListener('change', function() {
    var file = this.files[0];
    if (!file) return;
    
    var fileName = file.name;
    var fileExt = fileName.substring(fileName.lastIndexOf('.') + 1).toLowerCase();
    
    $('.file-tip').innerHTML = '正在读取文件...';
    
    var reader = new FileReader();
    reader.onload = function(e) {
        var content = e.target.result;
        
        if (fileExt === 'md' || fileExt === 'txt') {
            // 直接显示在输入框中让用户确认
            $('#fileInputContent').value = content;
            showMarkdownInput();
            $('.file-tip').innerHTML = '文件内容已加载到输入框中，请检查后点击"转换预览"';
        } else {
            $('.file-tip').innerHTML = '暂不支持该文件格式，请选择.md或.txt文件';
        }
    };
    
    reader.onerror = function() {
        $('.file-tip').innerHTML = '文件读取失败';
    };
    
    reader.readAsText(file, 'UTF-8');
});

// 与UEditor交互 - 等待页面加载完成
window.onload = function() {
    try {
        // 获取父窗口的UEditor相关对象
        var parent = window.parent;
        
        if (parent && parent.$EDITORUI && window.frameElement) {
            var dialogId = window.frameElement.id.replace(/_iframe$/, '');
            var dialog = parent.$EDITORUI[dialogId];
            var editor = dialog ? dialog.editor : null;
            
            if (dialog) {
                // 设置确认按钮处理
                dialog.onok = function() {
                    if (!contentImport.data.result) {
                        alert('请先选择文件或粘贴Markdown内容并转换');
                        return false;
                    }
                    
                    // 插入HTML内容到编辑器
                    if (editor) {
                        editor.fireEvent('saveScene');
                        editor.execCommand('inserthtml', contentImport.data.result);
                        editor.fireEvent('saveScene');
                    }
                    return true;
                };
                
                dialog.oncancel = function() {
                    // 取消操作
                    return true;
                };
                
                console.log('UEditor对话框初始化成功');
            }
        }
    } catch(e) {
        console.log('UEditor对话框初始化失败:', e);
    }
};
</script>
</body>
</html>
