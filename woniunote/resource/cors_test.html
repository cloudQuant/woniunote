<!DOCTYPE html>
<html>
<head>
    <title>CORS修复验证测试</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 5px 0; padding: 5px 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        .test-section { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>CORS修复验证测试</h1>
    
    <div class="test-section">
        <h2>1. 基础资源测试 (带CORS)</h2>
        <button onclick="testBasicResourcesWithCORS()">测试基础资源</button>
        <div id="basic-cors-results"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 对话框文件测试 (带CORS)</h2>
        <button onclick="testDialogFilesWithCORS()">测试对话框文件</button>
        <div id="dialog-cors-results"></div>
    </div>
    
    <script src="http://127.0.0.1:5001/js/jquery-3.4.1.min.js"></script>
    <script>
        function addResult(containerId, message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            document.getElementById(containerId).appendChild(div);
        }
        
        function testBasicResourcesWithCORS() {
            document.getElementById('basic-cors-results').innerHTML = '';
            const resources = [
                '/resource/ueditor/ueditor.config.js',
                '/resource/ueditor/ueditor.all.js',
                '/resource/ueditor/dialogs/internal.js',
                '/resource/ueditor/themes/default/css/ueditor.css'
            ];
            
            let completed = 0;
            const total = resources.length;
            
            resources.forEach(resource => {
                $.ajax({
                    url: 'http://127.0.0.1:5001' + resource,
                    method: 'GET',
                    crossDomain: true,
                    success: function(data, status, xhr) {
                        const size = xhr.getResponseHeader('Content-Length') || data.length;
                        const cors = xhr.getResponseHeader('Access-Control-Allow-Origin');
                        addResult('basic-cors-results', 
                            `✓ ${resource} - 大小: ${size}字节, CORS: ${cors}`, 'success');
                        completed++;
                        if (completed === total) {
                            addResult('basic-cors-results', 
                                `✅ 所有基础资源测试通过! (${completed}/${total})`, 'info');
                        }
                    },
                    error: function(xhr, status, error) {
                        addResult('basic-cors-results', 
                            `✗ ${resource} - 错误: ${error} (状态: ${xhr.status})`, 'error');
                        completed++;
                        if (completed === total) {
                            addResult('basic-cors-results', 
                                `测试完成，部分资源失败`, 'error');
                        }
                    }
                });
            });
        }
        
        function testDialogFilesWithCORS() {
            document.getElementById('dialog-cors-results').innerHTML = '';
            const dialogs = [
                'contentimport/contentimport.html',
                'link/link.html',
                'image/image.html',
                'table/edittable.html',
                'searchreplace/searchreplace.html',
                'emotion/emotion.html'
            ];
            
            let completed = 0;
            const total = dialogs.length;
            
            dialogs.forEach(dialog => {
                $.ajax({
                    url: `http://127.0.0.1:5001/resource/ueditor/dialogs/${dialog}`,
                    method: 'GET',
                    crossDomain: true,
                    success: function(data, status, xhr) {
                        // 检查必要组件
                        const hasInternalJs = data.includes('internal.js');
                        const hasHtmlStructure = data.includes('<!DOCTYPE') || data.includes('<html');
                        const cors = xhr.getResponseHeader('Access-Control-Allow-Origin');
                        
                        let status_class = 'success';
                        let message = `✓ ${dialog} - CORS: ${cors}`;
                        
                        if (!hasInternalJs) {
                            status_class = 'error';
                            message = `✗ ${dialog} - 缺少internal.js引用`;
                        } else if (!hasHtmlStructure) {
                            status_class = 'error';
                            message = `✗ ${dialog} - HTML结构不正确`;
                        } else {
                            message += ', 结构正确';
                        }
                        
                        addResult('dialog-cors-results', message, status_class);
                        completed++;
                        if (completed === total) {
                            addResult('dialog-cors-results', 
                                `✅ 所有对话框测试完成! (${completed}/${total})`, 'info');
                        }
                    },
                    error: function(xhr, status, error) {
                        addResult('dialog-cors-results', 
                            `✗ ${dialog} - 错误: ${error} (状态: ${xhr.status})`, 'error');
                        completed++;
                        if (completed === total) {
                            addResult('dialog-cors-results', 
                                `测试完成，部分对话框失败`, 'error');
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
