<!DOCTYPE html>
<html>
<head>
    <title>UEditor 测试页面</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 引入UEditor相关文件 -->
    <script type="text/javascript" src="/resource/ueditor/ueditor.config.js"></script>
    <script type="text/javascript" src="/resource/ueditor/ueditor.all.min.js"></script>
</head>
<body>
    <h1>UEditor 测试页面</h1>
    
    <!-- 加载编辑器的容器 -->
    <div>
        <script id="editor" type="text/plain" style="width:100%;height:400px;"></script>
    </div>

    <!-- 初始化编辑器 -->
    <script type="text/javascript">
        console.log("开始初始化编辑器...");
        
        // 检查UE对象是否存在
        console.log("UE对象状态:", typeof UE);
        
        // 延迟初始化，确保DOM和UEditor脚本都已完全加载
        setTimeout(function() {
            try {
                console.log("尝试初始化编辑器...");
                var ue = UE.getEditor('editor');
                console.log("编辑器初始化完成", ue);
                
                // 检查编辑器是否成功创建
                ue.ready(function() {
                    console.log("编辑器已准备就绪");
                    console.log("编辑器容器:", document.getElementById('editor'));
                    console.log("编辑器iframe:", document.querySelector('.edui-editor-iframeholder iframe'));
                });
            } catch(e) {
                console.error("初始化编辑器时出错:", e);
            }
        }, 1000);
    </script>
</body>
</html>
