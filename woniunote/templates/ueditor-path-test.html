<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UEditor 路径诊断工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h2 {
            color: #667eea;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .test-section {
            background: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 13px;
        }
        .path-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .status-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 UEditor 路径诊断工具</h1>
        
        <div class="test-section">
            <h2>1. 基础配置检查</h2>
            <button onclick="checkConfig()">检查配置</button>
            <div id="config-results"></div>
        </div>
        
        <div class="test-section">
            <h2>2. 关键文件路径测试</h2>
            <button onclick="testAllPaths()">测试所有路径</button>
            <button onclick="testDialogPaths()">测试对话框路径</button>
            <div id="path-results"></div>
        </div>
        
        <div class="test-section">
            <h2>3. 对话框资源测试</h2>
            <button onclick="testDialogResources()">测试对话框资源</button>
            <div id="dialog-results"></div>
        </div>
        
        <div class="test-section">
            <h2>4. 实际编辑器测试</h2>
            <button onclick="initEditor()">初始化编辑器</button>
            <button onclick="testButtons()">测试所有按钮</button>
            <div id="editor-results"></div>
            <div style="margin-top: 20px;">
                <script id="test-editor" type="text/plain" style="height: 400px;"></script>
            </div>
        </div>
    </div>

    <!-- 加载 UEditor -->
    <script type="text/javascript" src="/ueditor/ueditor.config.js"></script>
    <script type="text/javascript" src="/ueditor/ueditor.all.js"></script>
    
    <script>
        let editor = null;
        
        // 关键路径列表
        const criticalPaths = [
            '/ueditor/ueditor.config.js',
            '/ueditor/ueditor.all.js',
            '/ueditor/dialogs/internal.js',
            '/ueditor/themes/default/css/ueditor.css',
            '/ueditor/themes/default/images/spacer.gif',
            '/ueditor/lang/zh-cn/zh-cn.js'
        ];
        
        // 对话框路径列表
        const dialogPaths = [
            '/ueditor/dialogs/contentimport/contentimport.html',
            '/ueditor/dialogs/image/image.html',
            '/ueditor/dialogs/link/link.html',
            '/ueditor/dialogs/video/video.html',
            '/ueditor/dialogs/table/edittable.html',
            '/ueditor/dialogs/emotion/emotion.html',
            '/ueditor/dialogs/formula/formula.html'
        ];
        
        // 1. 检查配置
        function checkConfig() {
            const resultsDiv = document.getElementById('config-results');
            resultsDiv.innerHTML = '<div class="result info">正在检查...</div>';
            
            const config = {
                '当前页面URL': window.location.href,
                '协议': window.location.protocol,
                '主机': window.location.host,
                'UEDITOR_HOME_URL': window.UEDITOR_HOME_URL || '未设置',
                'UEDITOR_CONFIG存在': typeof window.UEDITOR_CONFIG !== 'undefined',
                'UE对象存在': typeof UE !== 'undefined'
            };
            
            if (window.UEDITOR_CONFIG) {
                config['配置的HOME_URL'] = window.UEDITOR_CONFIG.UEDITOR_HOME_URL;
                config['配置的CORS_URL'] = window.UEDITOR_CONFIG.UEDITOR_CORS_URL;
                config['serverUrl'] = window.UEDITOR_CONFIG.serverUrl;
            }
            
            const hasIssues = !config['UEDITOR_CONFIG存在'] || !config['UE对象存在'];
            
            resultsDiv.innerHTML = `
                <div class="result ${hasIssues ? 'error' : 'success'}">
                    <strong>${hasIssues ? '❌ 配置有问题' : '✅ 配置正常'}</strong>
                </div>
                <pre>${JSON.stringify(config, null, 2)}</pre>
            `;
        }
        
        // 2. 测试路径
        async function testPath(path) {
            try {
                const response = await fetch(path, { method: 'HEAD' });
                return {
                    path,
                    status: response.status,
                    ok: response.ok,
                    type: response.headers.get('content-type')
                };
            } catch (error) {
                return {
                    path,
                    status: 0,
                    ok: false,
                    error: error.message
                };
            }
        }
        
        async function testAllPaths() {
            const resultsDiv = document.getElementById('path-results');
            resultsDiv.innerHTML = '<div class="result info"><div class="loading"></div> 正在测试路径...</div>';
            
            const results = await Promise.all(criticalPaths.map(testPath));
            
            let html = '<div class="test-grid">';
            for (const result of results) {
                const statusClass = result.ok ? 'success' : 'error';
                const icon = result.ok ? '✅' : '❌';
                html += `
                    <div class="path-item">
                        <span class="status-icon">${icon}</span>
                        <div style="flex: 1;">
                            <strong>${result.path}</strong><br>
                            <small>状态: ${result.status} ${result.error || ''}</small>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            
            const failCount = results.filter(r => !r.ok).length;
            const summary = failCount === 0 
                ? '<div class="result success"><strong>✅ 所有路径测试通过！</strong></div>'
                : `<div class="result error"><strong>❌ ${failCount} 个路径测试失败</strong></div>`;
            
            resultsDiv.innerHTML = summary + html;
        }
        
        async function testDialogPaths() {
            const resultsDiv = document.getElementById('path-results');
            resultsDiv.innerHTML = '<div class="result info"><div class="loading"></div> 正在测试对话框路径...</div>';
            
            const results = await Promise.all(dialogPaths.map(testPath));
            
            let html = '<div class="test-grid">';
            for (const result of results) {
                const statusClass = result.ok ? 'success' : 'error';
                const icon = result.ok ? '✅' : '❌';
                const fileName = result.path.split('/').pop();
                html += `
                    <div class="path-item">
                        <span class="status-icon">${icon}</span>
                        <div style="flex: 1;">
                            <strong>${fileName}</strong><br>
                            <small>${result.path}</small><br>
                            <small>状态: ${result.status}</small>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            
            const failCount = results.filter(r => !r.ok).length;
            const summary = failCount === 0 
                ? '<div class="result success"><strong>✅ 所有对话框路径可访问！</strong></div>'
                : `<div class="result error"><strong>❌ ${failCount} 个对话框路径失败</strong></div>`;
            
            resultsDiv.innerHTML = summary + html;
        }
        
        // 3. 测试对话框资源
        async function testDialogResources() {
            const resultsDiv = document.getElementById('dialog-results');
            resultsDiv.innerHTML = '<div class="result info"><div class="loading"></div> 正在测试对话框内部资源...</div>';
            
            const dialogResourcePaths = [
                '/ueditor/dialogs/internal.js',
                '/ueditor/themes/default/dialogbase.css',
                '/ueditor/lang/zh-cn/images/localimage.png',
                '/ueditor/dialogs/emotion/images/jxface.gif',
                '/ueditor/dialogs/image/images/image.png'
            ];
            
            const results = await Promise.all(dialogResourcePaths.map(testPath));
            
            let html = '<div class="test-grid">';
            for (const result of results) {
                const icon = result.ok ? '✅' : '❌';
                html += `
                    <div class="path-item">
                        <span class="status-icon">${icon}</span>
                        <div style="flex: 1;">
                            <strong>${result.path.split('/').pop()}</strong><br>
                            <small>${result.path}</small><br>
                            <small>状态: ${result.status} - ${result.type || '未知类型'}</small>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            
            resultsDiv.innerHTML = html;
        }
        
        // 4. 初始化编辑器
        function initEditor() {
            const resultsDiv = document.getElementById('editor-results');
            
            try {
                if (editor) {
                    editor.destroy();
                }
                
                editor = UE.getEditor('test-editor', {
                    initialFrameHeight: 300,
                    autoHeightEnabled: false,
                    serverUrl: '/uedit',
                    toolbars: [[
                        'source', 'bold', 'italic', 'underline', '|',
                        'insertimage', 'link', 'insertvideo', '|',
                        'emotion', 'formula', '|',
                        'inserttable', 'contentimport'
                    ]]
                });
                
                editor.ready(function() {
                    resultsDiv.innerHTML = '<div class="result success"><strong>✅ 编辑器初始化成功！</strong><br>可以测试工具栏按钮了。</div>';
                });
                
            } catch(e) {
                resultsDiv.innerHTML = `<div class="result error"><strong>❌ 编辑器初始化失败</strong><br>${e.message}</div>`;
                console.error('编辑器初始化错误:', e);
            }
        }
        
        // 测试按钮
        function testButtons() {
            const resultsDiv = document.getElementById('editor-results');
            
            if (!editor) {
                resultsDiv.innerHTML = '<div class="result warning"><strong>⚠️ 请先初始化编辑器</strong></div>';
                return;
            }
            
            const buttons = [
                'insertimage', 'link', 'insertvideo', 'emotion', 
                'formula', 'inserttable', 'contentimport'
            ];
            
            let html = '<div class="result info"><strong>🔍 测试对话框按钮</strong></div><div class="test-grid">';
            
            for (const btnName of buttons) {
                try {
                    const dialogExists = editor.ui._dialogs && editor.ui._dialogs[btnName + 'Dialog'];
                    const icon = dialogExists ? '✅' : '❌';
                    html += `
                        <div class="path-item">
                            <span class="status-icon">${icon}</span>
                            <div style="flex: 1;">
                                <strong>${btnName}</strong><br>
                                <small>${dialogExists ? '对话框已注册' : '对话框未找到'}</small>
                                ${dialogExists ? `<br><button onclick="openDialog('${btnName}')">打开</button>` : ''}
                            </div>
                        </div>
                    `;
                } catch(e) {
                    html += `
                        <div class="path-item">
                            <span class="status-icon">❌</span>
                            <div style="flex: 1;">
                                <strong>${btnName}</strong><br>
                                <small>错误: ${e.message}</small>
                            </div>
                        </div>
                    `;
                }
            }
            
            html += '</div>';
            resultsDiv.innerHTML = html;
        }
        
        function openDialog(dialogName) {
            try {
                const dialog = editor.ui._dialogs[dialogName + 'Dialog'];
                if (dialog) {
                    dialog.open();
                } else {
                    alert('对话框不存在: ' + dialogName);
                }
            } catch(e) {
                alert('打开对话框失败: ' + e.message);
                console.error('对话框错误:', e);
            }
        }
        
        // 页面加载时自动检查配置
        window.addEventListener('load', function() {
            checkConfig();
        });
    </script>
</body>
</html>
