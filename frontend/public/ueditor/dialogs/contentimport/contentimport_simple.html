<!DOCTYPE html>
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <style type="text/css">
        .wrapper {
            width: 600px;
            padding: 10px;
            height: 352px;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #d7d7d7;
        }
        .wrapper .file-upload {
            display: flex;
            align-items: center;
        }
        .wrapper .file-upload .file-tip {
            color: #999;
            font-size: 12px;
            padding-left: 10px;
            flex-grow: 1;
        }
        .wrapper .file-manual {
            background: #EEE;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            line-height: 2;
        }
        .wrapper .file-manual .title {
            font-weight: bold;
            font-size: 120%;
        }
        .wrapper .file-manual .body li {
            list-style: disc;
            margin-left: 20px;
        }
        .wrapper .upload-button {
            width: 100px;
            height: 30px;
            background-color: #F8F8F8;
            border: 1px solid #EEE;
            border-radius: 4px;
            text-align: center;
            line-height: 28px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-right: 5px;
        }
        .wrapper .upload-button .text {
            display: inline-block;
            vertical-align: middle;
        }
        .wrapper .file-result {
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
            position: absolute;
            left: 10px;
            right: 10px;
            top: 50px;
            background: #FFF;
            bottom: 10px;
            overflow: auto;
            display: none;
        }
        .wrapper .file-input{
            position: absolute;
            left: 10px;
            right: 10px;
            top: 50px;
            background: #EEE;
            bottom: 10px;
            border-radius: 5px;
            display:none;
        }
        .wrapper .file-input textarea{
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: none;
            resize: none;
            border-radius: 5px;
            padding: 5px;
            outline: none;
            top: 30px;
        }
        .wrapper .file-input .tool{
            text-align: right;
            padding: 5px 10px;
        }
        .wrapper .file-input .tool a{
            display: inline-block;
            text-decoration: none;
            color: #333;
            background: #FFF;
            padding: 0 10px;
            line-height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="file-upload">
        <div class="upload-button">
            <div class="text" onclick="showMarkdownInput()">粘贴Markdown</div>
        </div>
        <div class="file-tip"></div>
    </div>
    <div class="file-manual">
        <div class="title">Markdown 转换工具</div>
        <div class="body">
            <ul>
                <li>支持标题、列表、链接、图片</li>
                <li>支持代码块和行内代码</li>
                <li>支持粗体、斜体、删除线</li>
                <li>支持表格和引用</li>
            </ul>
        </div>
    </div>
    <div class="file-result"></div>
    <div class="file-input">
        <textarea id="fileInputContent" placeholder="在此粘贴Markdown内容..."></textarea>
        <div class="tool">
            <a href="javascript:;" onclick="convertMarkdown()">确定</a>
            <a href="javascript:;" onclick="hideMarkdownInput()">关闭</a>
        </div>
    </div>
</div>

<script type="text/javascript">
// 简单的Markdown转HTML转换器
var SimpleMarkdown = {
    result: null,
    
    // 基础Markdown转换
    convert: function(markdown) {
        var html = markdown;
        
        // 转义HTML特殊字符（除了代码块内的）
        var codeBlocks = [];
        var codeIndex = 0;
        
        // 先提取代码块
        html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
            var placeholder = '___CODEBLOCK_' + (codeIndex++) + '___';
            codeBlocks.push({
                lang: lang || 'plaintext',
                code: code
            });
            return placeholder;
        });
        
        // 提取行内代码
        var inlineCodes = [];
        var inlineIndex = 0;
        html = html.replace(/`([^`]+)`/g, function(match, code) {
            var placeholder = '___INLINE_' + (inlineIndex++) + '___';
            inlineCodes.push(code);
            return placeholder;
        });
        
        // 转换标题
        html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
        
        // 转换粗体和斜体
        html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
        
        // 转换列表
        html = html.replace(/^\* (.*?)$/gm, '<li>$1</li>');
        html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');
        html = html.replace(/^\d+\. (.*?)$/gm, '<li>$1</li>');
        
        // 将连续的列表项包装在ul中
        html = html.replace(/(<li>.*?<\/li>\n?)+/g, function(match) {
            return '<ul>' + match + '</ul>';
        });
        
        // 转换链接和图片
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />');
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        
        // 转换引用
        html = html.replace(/^> (.*?)$/gm, '<blockquote>$1</blockquote>');
        
        // 转换水平线
        html = html.replace(/^---$/gm, '<hr>');
        html = html.replace(/^\*\*\*$/gm, '<hr>');
        
        // 转换段落
        html = html.replace(/\n\n/g, '</p><p>');
        html = '<p>' + html + '</p>';
        
        // 清理多余的标签
        html = html.replace(/<p><\/p>/g, '');
        html = html.replace(/<p>(<h[1-6]>)/g, '$1');
        html = html.replace(/(<\/h[1-6]>)<\/p>/g, '$1');
        html = html.replace(/<p>(<ul>)/g, '$1');
        html = html.replace(/(<\/ul>)<\/p>/g, '$1');
        html = html.replace(/<p>(<blockquote>)/g, '$1');
        html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
        html = html.replace(/<p>(<hr>)/g, '$1');
        html = html.replace(/(<hr>)<\/p>/g, '$1');
        
        // 还原代码块
        codeBlocks.forEach(function(block, index) {
            var placeholder = '___CODEBLOCK_' + index + '___';
            var codeHtml = '<pre><code class="language-' + block.lang + '">' +
                          block.code
                              .replace(/&/g, '&amp;')
                              .replace(/</g, '&lt;')
                              .replace(/>/g, '&gt;') +
                          '</code></pre>';
            html = html.replace(placeholder, codeHtml);
        });
        
        // 还原行内代码
        inlineCodes.forEach(function(code, index) {
            var placeholder = '___INLINE_' + index + '___';
            var codeHtml = '<code>' +
                          code
                              .replace(/&/g, '&amp;')
                              .replace(/</g, '&lt;')
                              .replace(/>/g, '&gt;') +
                          '</code>';
            html = html.replace(placeholder, codeHtml);
        });
        
        return html;
    }
};

// UI函数
function showMarkdownInput() {
    document.querySelector('.file-input').style.display = 'block';
    document.querySelector('.file-tip').innerHTML = '';
}

function hideMarkdownInput() {
    document.querySelector('.file-input').style.display = 'none';
}

function convertMarkdown() {
    var textarea = document.getElementById('fileInputContent');
    var markdown = textarea.value;
    
    if (!markdown) {
        document.querySelector('.file-tip').innerHTML = '请输入Markdown内容';
        return;
    }
    
    var html = SimpleMarkdown.convert(markdown);
    SimpleMarkdown.result = html;
    
    document.querySelector('.file-result').innerHTML = html;
    document.querySelector('.file-result').style.display = 'block';
    document.querySelector('.file-input').style.display = 'none';
    document.querySelector('.file-tip').innerHTML = '转换成功！点击"确认"按钮插入内容。';
}

// 与UEditor交互
(function() {
    // 获取父窗口的UEditor相关对象
    var parent = window.parent;
    var dialog, editor;
    
    try {
        // 获取dialog对象
        if (parent && parent.$EDITORUI) {
            dialog = parent.$EDITORUI[window.frameElement.id.replace(/_iframe$/, '')];
            editor = dialog ? dialog.editor : null;
        }
        
        // 设置确认和取消按钮的处理
        if (dialog) {
            dialog.onok = function() {
                if (!SimpleMarkdown.result) {
                    alert('请先粘贴并转换Markdown内容');
                    return false;
                }
                
                // 插入HTML内容到编辑器
                if (editor) {
                    editor.execCommand('inserthtml', SimpleMarkdown.result);
                }
            };
            
            dialog.oncancel = function() {
                // 取消操作
            };
        }
    } catch(e) {
        console.log('初始化UEditor对话框失败:', e);
    }
})();
</script>
</body>
</html>
