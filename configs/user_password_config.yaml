PERMANENT_SESSION_LIFETIME: 14400
SECRET_KEY: dev-woniunote-secret-key-2025
SESSION_PERMANENT: true
SESSION_TYPE: filesystem
WTF_CSRF_SECRET_KEY: dev-woniunote-csrf-key-2025

# 监控配置
monitoring:
  system_monitoring: true
  collect_interval: 30
  cpu_threshold: 85.0
  memory_threshold: 90.0
  disk_threshold: 85.0
  network_threshold: 80.0

# 缓存配置
cache:
  default_ttl: 300
  key_prefix: 'woniunote:'
  memory:
    default_ttl: 300
    max_size: 1000

# 限流配置 (增加10倍容量)
rate_limit:
  strict:
    max_requests: 200    # 原来20，增加到200
    window_size: 60      # 60秒窗口
  moderate:
    max_requests: 600    # 原来60，增加到600
    window_size: 60      # 60秒窗口
  lenient:
    max_requests: 2000   # 原来200，增加到2000
    window_size: 60      # 60秒窗口
  api:
    capacity: 500        # 原来50，增加到500
    refill_rate: 100     # 原来10，增加到100
    refill_period: 1     # 1秒补充周期
  upload:
    capacity: 50         # 原来5，增加到50
    refill_rate: 10      # 原来1，增加到10
    refill_period: 10    # 10秒补充周期

# 数据库配置
database:
  SQLALCHEMY_DATABASE_URI: mysql://woniunote_user:Woniunote_password1!@127.0.0.1:3306/woniunote?charset=utf8&autocommit=true
  SQLALCHEMY_MAX_OVERFLOW: 20
  SQLALCHEMY_POOL_RECYCLE: 1800
  SQLALCHEMY_POOL_SIZE: 10
  SQLALCHEMY_POOL_TIMEOUT: 30
  SQLALCHEMY_TRACK_MODIFICATIONS: false
