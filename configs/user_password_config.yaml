# 数据库配置
database:
  # 使用MySQL作为默认数据库
  SQLALCHEMY_DATABASE_URI: mysql://woniunote_user:Woniunote_password1!@127.0.0.1:3306/woniunote?charset=utf8&autocommit=true
  SQLALCHEMY_TRACK_MODIFICATIONS: false
  SQLALCHEMY_POOL_SIZE: 10
  SQLALCHEMY_POOL_TIMEOUT: 30
  SQLALCHEMY_POOL_RECYCLE: 1800
  SQLALCHEMY_MAX_OVERFLOW: 20

# 安全配置
SECRET_KEY: 'woniunote-secure-key-for-session-management-2025'
WTF_CSRF_SECRET_KEY: 'woniunote-csrf-secret-key-2025'

# 会话配置
SESSION_TYPE: 'filesystem'
SESSION_PERMANENT: true
PERMANENT_SESSION_LIFETIME: 14400

# 缓存配置
cache:
  default_ttl: 300
  key_prefix: 'woniunote:'
  memory:
    max_size: 2000
    default_ttl: 300 