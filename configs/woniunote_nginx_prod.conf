# WoniuNote Nginx 生产环境配置
# 支持 HTTPS + HTTP/2
# 用于替换 /etc/nginx/nginx.conf

# 事件配置
events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # 基础配置
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 高效文件传输配置 - 解决 ERR_INCOMPLETE_CHUNKED_ENCODING
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # 超时配置
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;
    
    # 增大输出缓冲区 - 解决大文件传输问题
    output_buffers 2 512k;
    
    # Gzip 压缩 (包括 mjs 和 json)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/javascript+module;

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name yunjinqi.top www.yunjinqi.top;
        
        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        
        # 重定向到 HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS 主配置
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name yunjinqi.top www.yunjinqi.top;

        # SSL 证书和密钥路径
        ssl_certificate /root/woniunote/configs/yunjinqi.top_nginx/yunjinqi.top_bundle.pem;
        ssl_certificate_key /root/woniunote/configs/yunjinqi.top_nginx/yunjinqi.top.key;
        
        # SSL 安全配置
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # 现代 SSL 配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # HSTS (可选，启用后需要 HTTPS 才能访问)
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # 前端静态文件 (Vue 构建产物)
        root /var/www/woniunote/frontend/dist;
        index index.html;

        # PDF.js worker 文件 - 必须在 location / 之前定义
        location = /pdf.worker.min.mjs {
            add_header Content-Type "text/javascript; charset=utf-8" always;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "" always;  # 覆盖 server 级别的 nosniff
            try_files $uri =404;
        }

        # 前端路由 - SPA 支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 代理到 C++ 后端
        location /api {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # 上传文件代理
        location /uploads {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # 缓存上传的静态文件
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 静态资源缓存 (包括 .mjs 文件，用于 PDF.js worker)
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            # 确保 .mjs 文件使用正确的 MIME 类型
            types {
                application/javascript js mjs;
            }
        }

        # PDF.js worker 文件特殊处理 - 确保 MIME 类型正确
        location ~* ^/assets/.*\.mjs$ {
            add_header Content-Type application/javascript always;
            add_header Cache-Control "public, immutable";
            expires 1y;
        }

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 日志
        access_log /var/log/nginx/woniunote_access.log;
        error_log /var/log/nginx/woniunote_error.log;
    }
}
